<!DOCTYPE html>
<html lang="pt-BR">
<head>

  {% include 'cabecalho_comum.html' %}
  <title>Pesquisa - Desafio das Perguntas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    :root {
      --padding-lateral-menor: 1.4rem;
      --padding-lateral-menor-menor: 1rem;
      --fs-aux: 0.85rem;
    }
    @media (max-width: 1200px) { 
      :root {
        --padding-lateral-menor: 0.8rem;
        --padding-lateral-menor-menor: 0.8rem;
        --fs-aux: 0.75rem;
      }
    }
    body {
      flex-shrink: 1;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100%;
      overflow: hidden;
      /*box-sizing: border-box;*/
      background: var(--cor-fundo-padrao);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
    }
    .pesquisa-header {
      display: flex;
      align-items: center;
      padding: 0.6rem var(--padding-lateral-menor);
      background-color: var(--cor-fundo-escuro);
      height: var(--header-height);
    }
    .header-titulo {
      font-size: var(--fs-title);
      font-weight: bold;
      color: white;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding-top: 1rem;
      -webkit-overflow-scrolling: touch;
    }
    .pesquisa-icon {
      width: 2.2rem;
      height: 2.2rem;
    }
    .top-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: start;
      gap: 2rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: white;
      text-align: left;
    }
    .filtros-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin: 0.5rem;
      gap: 2rem;
    }
    .filtro-esquerda, .filtro-direita {
      font-size: 1.2rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      color: white;
    }
    .filtro-centro {
      font-size: 1.2rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.8rem;
    }
    .filtro-centro label {
      display: block;
      font-size: 1.1rem;
      font-weight: normal;
      align-items: center;
      gap: 0.3rem;
    }
    .filtro-centro input[type="checkbox"] {
      transform: scale(1.6);
      -webkit-transform: scale(1.6);
      margin-right: 0.3rem;
    }
    select {
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: var(--peso-fonte-botoes);
      border: 2px solid black;
      align-self: center;
      text-align: center;
    }
    .selectors {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      align-items: center;
    }
    .selector {
      display: inline-block;
      width: 70px;
      align-items: center;
      gap: 0.6rem;
    }
    .tag {
      background-color: goldenrod;
      color: black;
      font-weight: bold;
      padding: 0.3rem 0.6rem;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: var(--padding-lateral-menor);
      margin-right: var(--padding-lateral-menor);
    }
    .tag button {
      background: none;
      border: none;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    #temas-container {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      width: 98%;
      flex-wrap: wrap;
      justify-content: space-between;
      row-gap: 1rem;
    }
    .btn-tema {
      font-size: var(--fs-aux);
      font-weight: var(--peso-fonte-botoes);
      width: 100%;
      white-space: nowrap;
      padding: 0.6rem 0;
      align-items: center;
      text-align: center;
      align-self: center;
      justify-self: center;
      margin-bottom: 0.3rem;
      border-radius: 6px;
      background: white;
      color: black;
      border: 2px solid black;
      background-color: #eee;
      cursor: pointer;
    }
    .filtros-linha {
      display: grid;
      grid-template-columns: auto auto;
      gap: 1rem;
      width: 100%;
      align-items: center;
      justify-content: start;
      margin-top: 0.8rem;
    }
    .filtros-grupo {
      /*
      flex-wrap: wrap;
      min-width: 0;*/
      display: flex;
      align-items: center;
      justify-self: flex-start;
      justify-content: flex-start;
      gap: 0.4rem;
      flex: 1 1 320px;
    }
    #texto-palavra-chave {
      font-size: 1.2rem;
      color: white;
      font-weight: bold;
      margin-left: 1rem;
      white-space: nowrap;
      flex-shrink: 0;
      flex: 0 0 auto;
    }
    #keyword-input {
      padding: 0.4rem 0.6rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 2px solid black;
      min-width: 180px;
      width: 220px;
      max-width: 50vw;
      flex: 1;
      min-width: 0;
    }
    .filtros-acoes {
      display: flex !important;
      gap: 0.8rem;
      align-items: center;
      min-width: 0;
      margin-left: 0;
      padding-left: 0;
    }
    .filtros-acoes button {
      width: 160px;
      max-width: 28vw;
      flex: 1;
      padding: 0.6rem 0;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    @media (min-width: 1301px) {
      #temas-container {
        column-gap: 0.5rem;
      }
    }
    @media (max-width: 1300px) {
      #temas-container {
        grid-template-rows: repeat(2, auto);
        column-gap: 1rem;
      }
      .btn-tema {
        width: 85%;
      }
    }
    @media (max-width: 816px) {
      #temas-container {
        column-gap: 0.2rem;
      }
    }
    @media (max-width: 780px) {
      .filtros-linha {
        grid-template-columns: 1fr;
        gap: 0.8rem;
        width: 100%;
      }
      .filtros-acoes {
        justify-self: center !important;
      }
      #temas-container {
        grid-template-rows: repeat(3, auto);
        column-gap: 0.6rem;
      }
    }
    @media (max-width: 520px) {
      #temas-container {
        grid-template-rows: repeat(4, auto);
        column-gap: 0.2rem;
      }
    }
    @media (max-width: 376px) {
      #temas-container {
        column-gap: 0.1rem;
        row-gap: 0.6rem;
      }
    }
    .btn-tema:hover {
      background-color: #eee;
      border-color: black;
      transform: scale(1.05);
    }
    .btn-tema.active {
      background-color: goldenrod;
      border-color: black;
    }
    .tabela-scroll-wrapper {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin-top: 0.8rem;
      align-self: stretch;
      padding-bottom: var(--major-footer-h);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      color: white;
    }
    th, td {
      border: 1px solid black;
      padding: 0.5rem;
      text-align: center;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 10;
      background-clip: padding-box;
      border-bottom: 1px solid black;
      border-right: 1px solid black;
      font-size: var(--fs-emph);
      background-color: var(--cor-fundo-escuro);
    }
    td {
      font-size: var(--fs-base);
      color: black;
      background-color: var(--cor-fundo-claro);
      font-weight: bold;
    }
    .tags {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      border: none;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;;
      font-weight: bold;
      background-color: var(--bg-botao-login);
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: var(--bg-hover-botao-login);
    }
    .footer {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Cabeçalho da página -->
  <header class="pesquisa-header">
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <img src="{{ url_for('static', filename='img/Pesquisa.png') }}" alt="Pesquisa" class="pesquisa-icon">
      <span class="header-titulo">Pesquisa Avançada</span>
    </div>
  </header>

  <!-- Parte central da página -->
  <main>
    <!-- Campo para escolha do tema -->
    <div id="temas-container">
      <button type="button" class="btn-tema" data-tema="Artes">Artes</button>
      <button type="button" class="btn-tema" data-tema="Astronomia">Astronomia</button>
      <button type="button" class="btn-tema" data-tema="Biologia">Biologia</button>
      <button type="button" class="btn-tema" data-tema="Esportes">Esportes</button>
      <button type="button" class="btn-tema" data-tema="Filosofia">Filosofia</button>
      <button type="button" class="btn-tema" data-tema="Física">Física</button>
      <button type="button" class="btn-tema" data-tema="Geografia">Geografia</button>
      <button type="button" class="btn-tema" data-tema="História">História</button>
      <button type="button" class="btn-tema" data-tema="Mídia">Mídia</button>
      <button type="button" class="btn-tema" data-tema="Música">Música</button>
      <button type="button" class="btn-tema" data-tema="Química">Química</button>
      <button type="button" class="btn-tema" data-tema="Variedades">Variedades</button>
    </div>

    <div class="filtros-linha">
      <!-- Bloco 1: Campo de Palavra-Chave -->
      <div class="filtro-grupo">
        <label id="texto-palavra-chave" for="keyword-input">Palavra-chave:</label>
        <input id="keyword-input" type="text" placeholder="Ex: Brasil, Paris, etc">
      </div>
      
      <!-- Bloco 2: Botões de Ação -->
      <div class="filtros-acoes">
        <button type="button" id="btn-adicionar">Adicionar</button>
        <button type="button" id="btn-pesquisar">Pesquisar</button>
        <button type="button" id="btn-limpar">Limpar tudo</button>
      </div>
    </div>

    <!-- Área das TAGs -->
    <div id="tags-container" class="tags"></div>

    <!-- Tabela com as informações das perguntas -->
    <div class="tabela-scroll-wrapper">
      <table id="tabela-perguntas">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Tema</th>
            <th>Enunciado</th>
            <th>Resposta correta</th>
            <th>Dificuldade</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  
  <!-- Layout inferior com os botões -->
  <div class="footer">
    <button id="btn-voltar">Voltar ao menu</button>
  </div>

  <script type="module" src="{{ url_for('static', filename='pesquisaAvancada.js') }}"></script>
</body>
</html>
